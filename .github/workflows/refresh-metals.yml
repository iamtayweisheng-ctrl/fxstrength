name: refresh-metals

# Refreshes the meter's metals block (public/metals-data.json) daily, in lockstep with
# the currency generator. build_metals_data.py pulls the metal FACTORS from FRED (real
# yields, broad USD, VIX) — all daily — and emits XAU/XAG driver blocks in the shape
# meter.html merges at load. Weights are principled (established macro), not yet
# data-calibrated, and labelled as such on the cards.
# Timed to the strength-trend reset (17:00 New York close). GitHub cron is UTC-only and
# can't follow US DST, so two entries cover the close year-round — 21:00 UTC (EDT summer)
# and 22:00 UTC (EST winter). The build commits only if the data changed, so the extra
# run each day is harmless.
on:
  schedule:
    - cron: '5 21 * * *'        # 21:05 UTC — 17:05 New York (EDT / US summer)
    - cron: '5 22 * * *'        # 22:05 UTC — 17:05 New York (EST / US winter)
  workflow_dispatch:            # allow manual runs

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install --quiet pandas numpy

      - name: Generate metals-data.json
        run: python build_metals_data.py

      - name: Commit if the data changed
        run: |
          git config --global user.name  "fxstrength-bot"
          git config --global user.email "bot@users.noreply.github.com"
          if git diff --quiet -- public/metals-data.json; then
            echo "No change in metals-data.json — nothing to commit."
          else
            git add public/metals-data.json
            git commit -q -m "data: refresh metals block (FRED factors)"
            git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:main
            echo "Pushed refreshed metals-data.json."
          fi
