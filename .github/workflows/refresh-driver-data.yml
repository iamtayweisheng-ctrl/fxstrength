name: refresh-driver-data

# Refreshes the Live Driver Meter's data (public/driver-data.json) daily.
# build_driver_data.py pulls the driver inputs, computes each driver's reading
# for all periods, and writes the JSON the /meter.html frontend fetches.
# Daily (not weekly): three inputs are now daily — risk (VIX), the yield edge
# (US 10Y) and oil (Yahoo CL=F) — so the meter's daily period must refresh each
# day. The slow series (foreign 10Y yields, iron ore) are monthly and simply
# don't change intra-week, but re-pulling them daily is harmless. Committing to
# main lets Cloudflare Pages serve the fresh file at /driver-data.json.
# Timed to the strength-trend reset (17:00 New York close), so the meter's daily
# data turns over with the trading day. GitHub cron is UTC-only and can't follow
# US DST, so two entries cover the close year-round — 21:00 UTC (EDT summer) and
# 22:00 UTC (EST winter). The build commits only if the data changed, so the
# extra run each day is harmless.
on:
  schedule:
    - cron: '0 21 * * *'        # 21:00 UTC — 17:00 New York (EDT / US summer)
    - cron: '0 22 * * *'        # 22:00 UTC — 17:00 New York (EST / US winter)
  workflow_dispatch:            # allow manual runs

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install --quiet pandas numpy

      - name: Generate driver-data.json
        run: python build_driver_data.py

      # Stamp the homepage's schema dateModified to today. The homepage's whole
      # proposition is live data, which this job refreshes daily — so a daily date
      # is honest and keeps the freshness signal from going stale. (We deliberately
      # do NOT stamp the affiliate page — its date reflects manual code re-checks.)
      - name: Stamp homepage freshness
        run: |
          python - <<'PY'
          import re, datetime, pathlib
          p = pathlib.Path("public/index.html")
          t = p.read_text(encoding="utf-8")
          today = datetime.datetime.utcnow().strftime("%Y-%m-%d")
          t2 = re.sub(r'"dateModified": "\d{4}-\d{2}-\d{2}"', '"dateModified": "%s"' % today, t, count=1)
          if t2 != t:
              p.write_text(t2, encoding="utf-8")
              print("stamped dateModified:", today)
          else:
              print("dateModified already current")
          PY

      - name: Commit if anything changed
        run: |
          git config --global user.name  "fxstrength-bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add public/driver-data.json public/index.html
          if git diff --cached --quiet; then
            echo "Nothing changed — nothing to commit."
          else
            git commit -q -m "data: refresh driver meter (FRED) + homepage freshness stamp"
            git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:main
            echo "Pushed."
          fi
