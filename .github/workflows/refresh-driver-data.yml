name: refresh-driver-data

# Refreshes the Live Driver Meter's data (public/driver-data.json) daily.
# build_driver_data.py pulls the driver inputs, computes each driver's reading
# for all periods, and writes the JSON the /meter.html frontend fetches.
# Daily (not weekly): three inputs are now daily — risk (VIX), the yield edge
# (US 10Y) and oil (Yahoo CL=F) — so the meter's daily period must refresh each
# day. The slow series (foreign 10Y yields, iron ore) are monthly and simply
# don't change intra-week, but re-pulling them daily is harmless. Committing to
# main lets Cloudflare Pages serve the fresh file at /driver-data.json.
on:
  schedule:
    - cron: '30 6 * * *'        # every day 06:30 UTC (just after the 06:20 calendar refresh)
  workflow_dispatch:            # allow manual runs

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install --quiet pandas numpy

      - name: Generate driver-data.json
        run: python build_driver_data.py

      - name: Commit if the data changed
        run: |
          git config --global user.name  "fxstrength-bot"
          git config --global user.email "bot@users.noreply.github.com"
          if git diff --quiet -- public/driver-data.json; then
            echo "No change in driver-data.json — nothing to commit."
          else
            git add public/driver-data.json
            git commit -q -m "data: refresh driver meter (FRED)"
            git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:main
            echo "Pushed refreshed driver-data.json."
          fi
