<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Driver Meter — v0 (private)</title>
  <!-- Private dogfooding tool. Not indexed, not linked from the site. -->
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0b0f17" />
  <style>
    :root{
      --bg:#0b0f17; --panel:#121826; --panel-2:#0f1420; --line:#1e2740;
      --ink:#e7ecf5; --muted:#8a97b1; --accent:#f59e0b;
      --green:#22c55e; --amber:#eab308; --red:#ef4444;
      --green-dim:rgba(34,197,94,.16); --amber-dim:rgba(234,179,8,.16); --red-dim:rgba(239,68,68,.16);
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);
      font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
    a{color:var(--accent);text-decoration:none}
    .wrap{max-width:900px;margin:0 auto;padding:20px 18px 60px}
    header.top{padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:18px}
    h1{font-size:20px;margin:0}
    .sub{color:var(--muted);font-size:13px;margin:2px 0 0}
    .pill{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
      color:#1a1200;background:var(--accent);padding:2px 8px;border-radius:999px}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin:0 0 16px}

    /* PAIR READOUT (headline, on top) */
    .readout{background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line)}
    .readout .rverdict{display:flex;gap:12px;align-items:flex-start}
    .rdot{width:14px;height:14px;border-radius:50%;margin-top:5px;flex:none}
    .rdot.g{background:var(--green)} .rdot.a{background:var(--amber)} .rdot.r{background:var(--red)}
    .rhead{font-size:19px;font-weight:700;line-height:1.35;margin:0}
    .rsub{color:var(--muted);font-size:13px;margin:8px 0 0}
    .rwhy{color:var(--ink);font-size:13px;line-height:1.55;margin:10px 0 0;padding:10px 12px;
      background:var(--panel-2);border:1px solid var(--line);border-radius:8px}
    .rwhy b{color:var(--ink)}
    .how{margin:0 0 16px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:0 14px}
    .how summary{cursor:pointer;padding:12px 0;font-weight:600;font-size:13.5px;color:var(--accent);list-style:none}
    .how summary::-webkit-details-marker{display:none}
    .how summary::before{content:"▸ ";color:var(--accent)}
    .how[open] summary::before{content:"▾ "}
    .how p{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.6}
    .how .hg{color:var(--green);font-weight:600} .how .ha{color:var(--amber);font-weight:600} .how .hr{color:var(--red);font-weight:600}
    /* risk backdrop strip (display-only, not in the tilt) */
    .riskstrip{margin:0 0 16px}
    .rs-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
    .rs-title{font-weight:700;font-size:14px}
    .rs-verdict{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
    .rs-verdict.g{background:var(--green-dim);color:var(--green)}
    .rs-verdict.a{background:var(--amber-dim);color:var(--amber)}
    .rs-verdict.r{background:var(--red-dim);color:var(--red)}
    .rs-chips{display:flex;gap:10px;flex-wrap:wrap}
    .rs-chip{flex:1;min-width:150px;background:var(--panel-2);border:1px solid var(--line);
      border-left:3px solid var(--line);border-radius:8px;padding:9px 12px}
    .rs-chip.g{border-left-color:var(--green)} .rs-chip.a{border-left-color:var(--amber)} .rs-chip.r{border-left-color:var(--red)}
    .rs-chip .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
    .rs-chip .v{font-size:14px;font-weight:700;margin-top:2px}
    .rs-chip .v small{font-weight:500;color:var(--muted);font-size:11.5px}
    .rs-note{margin:11px 0 0;font-size:11.5px;line-height:1.55;color:var(--muted)}
    .rs-note b{color:var(--ink)}

    /* CONTROLS */
    .controls{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end}
    .ctl{display:flex;flex-direction:column;gap:6px}
    .ctl .lab{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
    select{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
      border-radius:8px;padding:10px 12px;font-size:16px;min-width:130px}
    .segrow{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
    .segrow button{appearance:none;border:0;background:var(--panel-2);color:var(--muted);
      padding:10px 16px;font-size:14px;cursor:pointer;font-weight:600}
    .segrow button+button{border-left:1px solid var(--line)}
    .segrow.dir button.active{background:var(--green-dim);color:var(--green)}
    .segrow.per button.active{background:var(--accent);color:#1a1200}

    /* PERIOD EXPLAINER (separate from the buttons) */
    .explain{display:flex;gap:11px;align-items:flex-start;background:var(--panel-2);
      border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:12px 14px}
    .explain .ei{font-size:18px;line-height:1.2}
    .explain .et{font-size:13px;line-height:1.5}
    .explain .et b{color:var(--ink)}

    /* CURRENCY CARDS */
    .cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
    .card.long{border-color:rgba(34,197,94,.4)}
    .card.short{border-color:rgba(239,68,68,.35)}
    .chead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:3px}
    .cname{font-weight:700}
    .ccode{color:var(--muted);font-weight:600;font-size:12px;margin-right:6px}
    .side{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:2px 8px;border-radius:999px}
    .side.long{background:var(--green-dim);color:var(--green)}
    .side.short{background:var(--red-dim);color:var(--red)}
    .ctilt{font-size:12.5px;color:var(--muted);margin:0 0 13px}
    .ctilt b.g{color:var(--green)} .ctilt b.a{color:var(--amber)} .ctilt b.r{color:var(--red)}
    .drv{display:flex;flex-direction:column;gap:11px}
    .d{display:grid;grid-template-columns:12px 1fr;gap:11px;align-items:start}
    .dot{width:11px;height:11px;border-radius:50%;margin-top:4px}
    .dot.green{background:var(--green)} .dot.amber{background:var(--amber)} .dot.red{background:var(--red)}
    .dl{font-weight:600;font-size:13.5px}
    .dr{color:var(--muted);font-size:12.5px}
    .china{margin:14px 0 0;padding:11px 12px;background:var(--panel-2);border:1px solid var(--line);
      border-radius:8px;color:var(--muted);font-size:11.5px;line-height:1.5}

    .smallprint{color:var(--muted);font-size:11.5px;line-height:1.55;margin-top:6px}
    .smallprint b{color:var(--ink)}
    .asof{font-size:12px;color:var(--muted)}
    .legend{color:var(--muted);font-size:11.5px;line-height:1.5;text-align:center;margin:14px 4px 0}
    .legend a{color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(245,158,11,.35)}
    .loading{color:var(--muted);text-align:center;padding:30px}
    @media(max-width:560px){.cards{grid-template-columns:1fr}.rhead{font-size:17px}}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <h1>Live Driver Meter <span class="pill">v0 · private</span></h1>
      <p class="sub">Pick a pair, a direction and a time period. Which side's macro story is currently stronger —
        computed from live data, not opinion. <span class="asof" id="asof"></span></p>
    </header>

    <div id="app"><p class="loading">Loading live driver data…</p></div>

    <template id="tpl">
      <!-- HOW THIS WORKS (plain-English formula) -->
      <details class="how">
        <summary>How this works</summary>
        <p>Each currency has a few <b>drivers</b>, weighted by how much they've historically moved it.
        We read each driver's recent move, mark it <span class="hg">green</span> /
        <span class="ha">amber</span> / <span class="hr">red</span>, and weight it. The side whose
        weighted drivers lean more positive is the "stronger story." Nothing here predicts price —
        it organises the evidence.</p>
      </details>

      <!-- RISK BACKDROP — global, display-only (NOT in the per-currency tilt) -->
      <section class="panel riskstrip" id="riskstrip" hidden>
        <div class="rs-head">
          <span class="rs-title">Risk backdrop</span>
          <span class="rs-verdict" id="rs-verdict"></span>
        </div>
        <div class="rs-chips" id="rs-chips"></div>
        <p class="rs-note">Three different markets' read on risk — <b>options</b> (VIX), <b>equities</b>
          (S&amp;P 500) and <b>FX</b> (currency strength). When all three agree the risk read is strong; when
          they split, treat it cautiously. Context only — this is separate from the per-currency scores below
          and does <b>not</b> feed them.</p>
      </section>

      <!-- CONTROLS -->
      <section class="panel">
        <div class="controls">
          <div class="ctl">
            <span class="lab">Pair</span>
            <select id="pair" aria-label="Currency pair"></select>
          </div>
          <div class="ctl">
            <span class="lab">Direction</span>
            <div class="segrow dir" id="dir" role="group" aria-label="Direction">
              <button data-dir="buy" class="active">Buy</button>
              <button data-dir="sell">Sell</button>
            </div>
          </div>
          <div class="ctl">
            <span class="lab">Period</span>
            <div class="segrow per" id="per" role="group" aria-label="Period">
              <button data-per="daily" class="active">Daily</button>
              <button data-per="weekly">Weekly</button>
            </div>
          </div>
        </div>
      </section>

      <!-- PERIOD EXPLAINER (separate block) -->
      <section class="panel" style="padding:0;background:transparent;border:0;margin-bottom:16px">
        <div class="explain">
          <span class="ei" id="ei">📈</span>
          <span class="et" id="et"></span>
        </div>
      </section>

      <!-- CURRENCY CARDS -->
      <div class="cards" id="cards"></div>

      <!-- PAIR READOUT — second from bottom, between the cards and the small print -->
      <section class="panel readout" style="margin-top:16px">
        <div class="rverdict">
          <span class="rdot" id="rdot"></span>
          <div>
            <p class="rhead" id="rhead"></p>
            <p class="rsub" id="rsub"></p>
            <p class="rwhy" id="rwhy"></p>
          </div>
        </div>
      </section>

      <!-- SMALL PRINT -->
      <section class="panel" style="margin-top:16px">
        <p class="smallprint"><b>Evidence, not a signal.</b> This organises what the data is currently saying about
        each currency's drivers — it is not a recommendation to buy or sell, and shows direction, not size.
        The rules and weights are fixed; it won't catch regime shifts (e.g. yields rising from fiscal stress),
        so use your own judgement. <span id="asof2"></span></p>
      </section>

      <!-- SOURCES LEGEND — one compact linked line, not repeated per driver -->
      <p class="legend">Data: Risk = <a href="https://fred.stlouisfed.org/series/VIXCLS" target="_blank" rel="noopener">CBOE VIX</a>
        · Rates = <a href="https://fred.stlouisfed.org/series/DGS10" target="_blank" rel="noopener">10Y government yields</a>
        · Commodities = <a href="https://fred.stlouisfed.org/series/PIORECRUSDM" target="_blank" rel="noopener">IMF iron ore</a>
        — all via <a href="https://fred.stlouisfed.org/" target="_blank" rel="noopener">FRED</a>. Updated weekly.</p>
    </template>
  </div>

  <script>
  var NAMES={EUR:'Euro',GBP:'British Pound',AUD:'Australian Dollar',NZD:'New Zealand Dollar',
    USD:'US Dollar',CAD:'Canadian Dollar',CHF:'Swiss Franc',JPY:'Japanese Yen'};
  var ORDER=['EUR','GBP','AUD','NZD','USD','CAD','CHF','JPY'];
  var EXPLAIN={
    daily:['📊','<b>Daily — the ~30-day picture.</b> Matches the strength meter’s daily window, so the two line up: this explains <i>why</i> a currency is where the meter shows it over the past month.'],
    weekly:['🗓️','<b>Weekly — the ~26-week trend.</b> Matches the strength meter’s weekly window — the slower, multi-month backdrop behind the score.']
  };
  var LEAN_BAND=0.10;  // |tilt| below this = "roughly balanced / mixed"
  var DATA=null, state={dir:'buy',per:'daily',pair:'NZD/CHF'};

  var MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var MONA=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function fmtMonth(ym){ if(!ym)return ''; var p=ym.split('-'); return MON[parseInt(p[1],10)-1]+' '+p[0]; }
  function fmtDay(ymd){ if(!ymd)return ''; var p=ymd.split('-'); if(p.length<3)return fmtMonth(ymd);
    return MONA[parseInt(p[1],10)-1]+' '+parseInt(p[2],10)+', '+p[0]; }
  function asofLine(){
    if(DATA.as_of_risk||DATA.as_of_slow)
      return 'Risk & US rates: as of '+fmtDay(DATA.as_of_risk)+
             ' · Foreign rates & commodities: as of '+fmtMonth(DATA.as_of_slow)+'.';
    return 'Data as of '+fmtMonth(DATA.as_of)+'.';
  }
  function leanClass(t){ if(t> LEAN_BAND)return 'g'; if(t< -LEAN_BAND)return 'r'; return 'a'; }
  function leanWord(t){ var c=leanClass(t); return c==='g'?'stronger':c==='r'?'weaker':'about level'; }
  function lc(s){ return s.charAt(0).toLowerCase()+s.slice(1); }
  function eff(colour){ return colour==='green'?'supporting it':colour==='red'?'weighing on it':'flat'; }
  function topDriver(ccy){ return DATA.periods[state.per][ccy].drivers[0]; }  // drivers are weight-sorted
  // "Why" line: name the deciding driver via each side's top-weight driver.
  function whyLine(longC,shortC,cls){
    var tail=' <span style="color:var(--muted)">See the drivers above and the data sources below.</span>';
    if(cls==='a'){
      return '<b>Why:</b> '+longC+' and '+shortC+' are evenly matched right now — '+longC+'’s '+
        lc(topDriver(longC).label)+' and '+shortC+'’s '+lc(topDriver(shortC).label)+' roughly offset.'+tail;
    }
    var lt=DATA.periods[state.per][longC].tilt, st=DATA.periods[state.per][shortC].tilt;
    var strong=lt>=st?longC:shortC, weak=lt>=st?shortC:longC;
    var sd=topDriver(strong), wd=topDriver(weak);
    return '<b>Why:</b> '+strong+'’s biggest driver is '+lc(sd.label)+', and it’s '+eff(sd.colour)+
      ' right now. '+weak+'’s main driver is '+lc(wd.label)+', which is '+eff(wd.colour)+
      ' — so '+strong+'’s story edges ahead.'+tail;
  }

  function buildPairs(){
    // Match the homepage pair-picker exactly: build with PRIORITY orientation
    // (base = earlier in ORDER), then sort the concatenated 6-char string.
    var sel=document.getElementById('pair'),pairs=[];
    for(var i=0;i<ORDER.length;i++)for(var j=i+1;j<ORDER.length;j++)pairs.push(ORDER[i]+ORDER[j]);
    pairs.sort();
    sel.innerHTML=pairs.map(function(p){var v=p.slice(0,3)+'/'+p.slice(3);
      return '<option'+(v===state.pair?' selected':'')+'>'+v+'</option>';}).join('');
  }

  function card(ccy,side){
    var per=DATA.periods[state.per][ccy];
    var cls=leanClass(per.tilt);
    var word=cls==='g'?'leaning stronger':cls==='r'?'leaning weaker':'mixed / flat';
    var drv=per.drivers.map(function(d){
      return '<div class="d"><span class="dot '+d.colour+'"></span>'+
        '<div><div class="dl">'+d.label+'</div><div class="dr">'+d.reason+'</div></div></div>';
    }).join('');
    var china='';
    if(ccy==='AUD') china='<div class="china">China is the biggest buyer of Australian iron ore — the data shows '+
      'its influence reaches the Aussie dollar <b>through iron ore</b>, which this meter already tracks.</div>';
    else if(ccy==='NZD') china='<div class="china">New Zealand’s dairy exports are the kiwi’s own story and aren’t a '+
      'separate light here; the commodity reading above reflects the broader global commodity cycle the data links to NZD.</div>';
    return '<div class="card '+side+'">'+
      '<div class="chead"><div><span class="ccode">'+ccy+'</span><span class="cname">'+NAMES[ccy]+'</span></div>'+
      '<span class="side '+side+'">'+(side==='long'?'BUY SIDE':'SELL SIDE')+'</span></div>'+
      '<p class="ctilt">Net evidence: <b class="'+cls+'">'+word+'</b> right now.</p>'+
      '<div class="drv">'+drv+'</div>'+china+'</div>';
  }

  function render(){
    var parts=state.pair.split('/'),base=parts[0],quote=parts[1];
    var longC=state.dir==='buy'?base:quote, shortC=state.dir==='buy'?quote:base;
    // readout
    var lt=DATA.periods[state.per][longC].tilt, st=DATA.periods[state.per][shortC].tilt, diff=lt-st;
    var cls=leanClass(diff);
    document.getElementById('rdot').className='rdot '+cls;
    var dirW=state.dir.toUpperCase();
    var head, sub;
    if(cls==='g'){ head='For a '+dirW+' '+state.pair+', the evidence currently leans your way.';
      sub=longC+'’s macro story is the stronger of the two right now, which is what a '+dirW.toLowerCase()+' needs.'; }
    else if(cls==='r'){ head='For a '+dirW+' '+state.pair+', the evidence currently leans against you.';
      sub=shortC+'’s story is the stronger of the two — the opposite of what a '+dirW.toLowerCase()+' wants.'; }
    else { head='For a '+dirW+' '+state.pair+', the evidence is balanced right now.';
      sub='Neither '+longC+'’s nor '+shortC+'’s story is clearly stronger at this period.'; }
    document.getElementById('rhead').textContent=head;
    var align=(/JPY|CHF/.test(longC)||/JPY|CHF/.test(shortC))?
      ' <span style="color:var(--amber)">Note: JPY and CHF still rely on monthly foreign-yield data, so this pair isn’t fully aligned with the strength meter yet.</span>':'';
    document.getElementById('rsub').innerHTML=sub+' <span style="color:var(--muted)">Not a signal — evidence only.</span>'+align;
    document.getElementById('rwhy').innerHTML=whyLine(longC,shortC,cls);
    // explainer
    document.getElementById('ei').textContent=EXPLAIN[state.per][0];
    document.getElementById('et').innerHTML=EXPLAIN[state.per][1];
    // cards (long first)
    document.getElementById('cards').innerHTML=card(longC,'long')+card(shortC,'short');
  }

  function mount(){
    var tpl=document.getElementById('tpl').content.cloneNode(true);
    var app=document.getElementById('app'); app.innerHTML=''; app.appendChild(tpl);
    buildPairs();
    document.getElementById('pair').addEventListener('change',function(){state.pair=this.value;render();});
    document.getElementById('dir').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
      state.dir=b.getAttribute('data-dir');[].forEach.call(this.children,function(x){x.classList.toggle('active',x===b);});render();});
    document.getElementById('per').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
      state.per=b.getAttribute('data-per');[].forEach.call(this.children,function(x){x.classList.toggle('active',x===b);});render();});
    var asof=asofLine();
    document.getElementById('asof').textContent=asof;
    document.getElementById('asof2').textContent=asof;
    render();
    loadRiskBackdrop();
  }

  // ── Risk backdrop strip: display-only, reads the LIVE site matrix (VIX + S&P + FX gauge). ──
  // NOT part of the calibrated tilt — three independent markets shown for confluence only.
  var MATRIX_URL='https://raw.githubusercontent.com/iamtayweisheng-ctrl/fxstrength/data/matrix.json';
  function avgScore(sc,arr){var t=0,n=0;arr.forEach(function(c){if(sc[c]){t+=sc[c].score;n++;}});return n?t/n:5;}
  function loadRiskBackdrop(){
    fetch(MATRIX_URL+'?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();})
      .then(renderRisk).catch(function(){
        fetch('/data/matrix.json').then(function(r){return r.json();}).then(renderRisk).catch(function(){});
      });
  }
  function renderRisk(m){
    try{
      var strip=document.getElementById('riskstrip'); if(!strip||!m) return;
      var mk=m.market||{};
      var tf=(m.timeframes&&(m.timeframes.daily||m.timeframes[(m.timeframe_order||[])[0]]))||{};
      var sc=tf.scores||{};
      var gauge=avgScore(sc,['AUD','NZD','CAD'])-avgScore(sc,['USD','JPY','CHF']);
      var vx=mk.vix?mk.vix.level:null, vixSign=vx==null?0:(vx<18?1:vx>22?-1:0);
      var sp=mk.sp500?mk.sp500.pct:null, spSign=sp==null?0:(sp>=0.05?1:sp<=-0.05?-1:0);
      var fxSign=gauge>1.5?1:gauge<-1.5?-1:0;
      function cls(s){return s>0?'g':s<0?'r':'a';}
      function word(s){return s>0?'risk-on':s<0?'risk-off':'neutral';}
      var chips=[
        {k:'Options · VIX', main:(vx!=null?vx.toFixed(1):'—'),
         sub:(mk.vix?((mk.vix.chg>=0?'+':'')+mk.vix.chg+' · '):'')+word(vixSign), s:vixSign},
        {k:'Equities · S&P 500', main:(sp!=null?(sp>=0?'+':'')+sp+'%':'—'),
         sub:(mk.sp500?(mk.sp500.level+' · '):'')+word(spSign), s:spSign},
        {k:'FX · currency strength', main:(gauge>=0?'+':'')+gauge.toFixed(1),
         sub:'risk-on vs havens · '+word(fxSign), s:fxSign}
      ];
      document.getElementById('rs-chips').innerHTML=chips.map(function(c){
        return '<div class="rs-chip '+cls(c.s)+'"><div class="k">'+c.k+'</div>'+
               '<div class="v">'+c.main+' <small>'+c.sub+'</small></div></div>';
      }).join('');
      var signs=[vixSign,spSign,fxSign];
      var allOn=signs.every(function(s){return s>0;}), allOff=signs.every(function(s){return s<0;});
      var vd=document.getElementById('rs-verdict');
      if(allOn){vd.className='rs-verdict g';vd.textContent='Risk-ON — all three markets agree';}
      else if(allOff){vd.className='rs-verdict r';vd.textContent='Risk-OFF — all three markets agree';}
      else{vd.className='rs-verdict a';vd.textContent='Mixed — markets split, read risk cautiously';}
      strip.hidden=false;
    }catch(e){}
  }

  fetch('/driver-data.json',{cache:'no-cache'}).then(function(r){return r.json();}).then(function(d){
    DATA=d; mount();
  }).catch(function(e){
    document.getElementById('app').innerHTML='<p class="loading">Could not load driver data. '+
      'Run <code>python build_driver_data.py</code> and redeploy.</p>';
  });
  </script>
</body>
</html>
